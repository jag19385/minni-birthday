<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1224">
  <title>For Minni, From Annayya ❤️</title>
  <meta name="description" content="A cinematic birthday journey for Blessy, from Jagadeesh.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body data-theme="night" data-bg="night">
  <!-- Cinematic backdrop layers (cross-faded per phase) -->
  <div class="bg bg-night" aria-hidden="true"></div>
  <div class="bg bg-golden" aria-hidden="true"><i class="leak l1"></i><i class="leak l2"></i></div>
  <div class="bg bg-storm" aria-hidden="true"><i class="drops"></i></div>
  <div class="bg bg-sunrise" aria-hidden="true"><i class="warm"></i></div>
  <div class="sun" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="floating-hearts" class="floating-hearts" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><i></i></div>

  <button id="music" class="music" type="button" aria-pressed="false" aria-label="Play 'As It Was' (Instrumental)">
    <svg class="ico-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
    <svg class="ico-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>
  </button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="bg-music" preload="none" loop></audio>

  <main id="stage" class="stage"></main>

  <noscript><p class="nojs">This little birthday journey needs JavaScript to play. Happy Birthday, Minni ❤️</p></noscript>

  <script src="src/story.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
